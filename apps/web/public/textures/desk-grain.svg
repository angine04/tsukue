<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="presentation">
  <filter id="desk-grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="11" stitchTiles="stitch" result="noise" />
    <feColorMatrix in="noise" type="saturate" values="0" result="gray" />
    <feComponentTransfer in="gray">
      <feFuncA type="linear" slope="0.22" />
    </feComponentTransfer>
  </filter>
  <rect width="240" height="240" filter="url(#desk-grain)" />
</svg>
