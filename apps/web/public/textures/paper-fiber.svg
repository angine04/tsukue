<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="presentation">
  <filter id="paper-fiber" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.04" numOctaves="2" seed="4" stitchTiles="stitch" result="fiber" />
    <feColorMatrix in="fiber" type="saturate" values="0" result="gray" />
    <feComponentTransfer in="gray">
      <feFuncA type="linear" slope="0.07" />
    </feComponentTransfer>
  </filter>
  <rect width="180" height="180" filter="url(#paper-fiber)" />
</svg>
